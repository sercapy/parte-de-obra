      --warn:#F2C64D;
      --warn-soft:#3A2E0E;
      --bad:#FF7A72;
      --bad-soft:#3A1D1B;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 24px rgba(0,0,0,.4);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#15181C;
    --surface:#1E2227;
    --surface-2:#262B31;
    --ink:#ECE8E0;
    --ink-dim:#A8AFB8;
    --ink-faint:#767E88;
    --line:#333941;
    --accent:#FF8A50;
    --accent-ink:#1A0D05;
    --accent-soft:#3A2418;
    --accent-2:#6FB0E8;
    --accent-2-soft:#1C2E3B;
    --good:#5FCB7E;
    --good-soft:#173424;
    --warn:#F2C64D;
    --warn-soft:#3A2E0E;
    --bad:#FF7A72;
    --bad-soft:#3A1D1B;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 24px rgba(0,0,0,.4);
    color-scheme: dark;
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    -webkit-tap-highlight-color:transparent;
    overscroll-behavior-y:none;
  }
  h1,h2,h3{ font-family:'Oswald',system-ui,sans-serif; letter-spacing:.01em; text-wrap:balance; margin:0; }
  .num, input[type=number], .tab-num{ font-family:'JetBrains Mono',monospace; font-variant-numeric:tabular-nums; }
  button{ font-family:inherit; }
  a{ color:var(--accent-2); }

  #app{ max-width:560px; margin:0 auto; display:flex; flex-direction:column; background:var(--bg); }

  /* ---------- Header ---------- */
  header.topbar{
    position:sticky; top:0; z-index:20;
    background:var(--bg);
    border-bottom:1px solid var(--line);
    padding:10px 14px 10px;
  }
  .brandrow{ display:flex; align-items:center; gap:10px; margin-bottom:8px; }
  .brand{ display:flex; align-items:center; gap:8px; flex:1; min-width:0; }
  .brand .mark{ width:30px; height:30px; border-radius:8px; background:var(--accent); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .brand .mark svg{ width:17px; height:17px; }
  .brand .mark.logomark{ width:auto; max-width:118px; height:36px; padding:4px 6px; background:#fff; }
  .brand .mark.logomark img{ height:100%; width:auto; max-width:100%; display:block; border-radius:2px; object-fit:contain; }
  .brand h1{ font-size:17px; font-weight:600; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .status-pill{
    display:flex; align-items:center; gap:5px; font-size:11px; font-weight:600;
    padding:4px 9px; border-radius:99px; white-space:nowrap; flex-shrink:0;
    background:var(--surface-2); color:var(--ink-dim);
  }
  .status-pill .dot{ width:6px; height:6px; border-radius:50%; background:var(--ink-faint); }
  .status-pill.ok .dot{ background:var(--good); }
  .status-pill.busy .dot{ background:var(--warn); animation:pulse 1s infinite; }
  .status-pill.off .dot{ background:var(--bad); }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.35;} }

  .obraselect{
    display:flex; align-items:center; gap:8px;
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-sm);
    padding:9px 10px;
  }
  .obraselect svg{ width:16px; height:16px; color:var(--ink-faint); flex-shrink:0; }
  .obraselect select{
    flex:1; border:none; background:transparent; font-size:14.5px; font-weight:600; color:var(--ink);
    -webkit-appearance:none; appearance:none; padding:2px 0;
  }

  /* ---------- Main / tabs ---------- */
  main{ padding:14px 14px 18px; }
  .tabpanel{ display:none; animation:fade .15s ease; }
  .tabpanel.active{ display:block; }
  @keyframes fade{ from{ opacity:0; transform:translateY(3px);} to{ opacity:1; transform:none; } }

  .section-title{ font-size:12.5px; font-weight:600; text-transform:uppercase; letter-spacing:.07em; color:var(--ink-faint); margin:22px 0 10px; }
  .section-title:first-child{ margin-top:0; }

  /* ---------- Cards / lists ---------- */
  .card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); }
  .card + .card{ margin-top:10px; }

  .empty{
    text-align:center; padding:34px 18px; color:var(--ink-dim); background:var(--surface);
    border:1px dashed var(--line); border-radius:var(--radius);
  }
  .empty svg{ width:34px; height:34px; color:var(--ink-faint); margin-bottom:10px; }
  .empty p{ margin:0 0 12px; font-size:14px; line-height:1.5; }

  /* KPI row */
  .kpirow{ display:grid; grid-template-columns:repeat(2,1fr); gap:9px; }
  .kpi{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:13px 14px; box-shadow:var(--shadow); }
  .kpi .lbl{ font-size:11.5px; color:var(--ink-faint); font-weight:600; text-transform:uppercase; letter-spacing:.04em; }
  .kpi .val{ font-size:24px; font-weight:600; margin-top:3px; }
  .kpi .val.accent{ color:var(--accent); }
  .kpi .val.blue{ color:var(--accent-2); }
  .kpi .sub{ font-size:11.5px; color:var(--ink-dim); margin-top:2px; }

  /* Day nav */
  .daynav{ display:flex; align-items:center; gap:8px; margin-bottom:14px; }
  .daynav button.arrow{
    width:38px; height:38px; border-radius:10px; border:1px solid var(--line); background:var(--surface);
    display:flex; align-items:center; justify-content:center; color:var(--ink); flex-shrink:0;
  }
  .daynav button.arrow svg{ width:16px; height:16px; }
  .daynav .datebox{
    flex:1; display:flex; align-items:center; justify-content:center; gap:8px;
    background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:9px 10px; position:relative;
  }
  .daynav .datebox span{ font-weight:600; font-size:14.5px; text-transform:capitalize; }
  .daynav .datebox input{ position:absolute; inset:0; opacity:0; width:100%; height:100%; border:none; }
  .daynav .today-badge{ font-size:10.5px; font-weight:700; color:var(--accent); background:var(--accent-soft); padding:2px 7px; border-radius:99px; }

  .total-today{ display:flex; align-items:baseline; justify-content:space-between; padding:14px 16px; margin-bottom:14px;
    background:linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 75%, #000 10%)); border-radius:var(--radius); color:var(--accent-ink); box-shadow:var(--shadow); }
  .total-today .t-lbl{ font-size:12.5px; font-weight:600; text-transform:uppercase; letter-spacing:.05em; opacity:.9; }
  .total-today .t-val{ font-size:30px; font-weight:700; }
  .total-today .t-val small{ font-size:14px; font-weight:600; opacity:.85; }

  /* Contratista rows */
  .clist .crow{ display:flex; align-items:center; gap:10px; padding:12px 14px; border-bottom:1px solid var(--line); }
  .clist .crow:last-child{ border-bottom:none; }
  .crow .cname{ flex:1; min-width:0; }
  .crow .cname .n{ font-weight:600; font-size:14.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .crow .cname .m{ font-size:11.5px; color:var(--ink-faint); }
  .stepper{ display:flex; align-items:center; gap:0; background:var(--surface-2); border-radius:10px; overflow:hidden; flex-shrink:0; }
  .stepper button{ width:34px; height:34px; border:none; background:transparent; color:var(--ink); font-size:18px; display:flex; align-items:center; justify-content:center; }
  .stepper button:active{ background:var(--line); }
  .stepper input{ width:40px; height:34px; text-align:center; border:none; background:transparent; font-size:15.5px; font-weight:600; color:var(--ink); }

  .addrow-btn{
    width:100%; display:flex; align-items:center; justify-content:center; gap:7px;
    padding:12px; background:transparent; border:none; color:var(--accent-2); font-weight:600; font-size:13.5px;
  }
  .addrow-btn svg{ width:15px; height:15px; }

  /* Bitacora */
  .bitacora textarea{
    width:100%; min-height:64px; resize:vertical; border:1px solid var(--line); border-radius:10px;
    padding:10px 11px; font-family:inherit; font-size:14px; color:var(--ink); background:var(--surface); margin-bottom:10px;
  }
  .photogrid{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:10px; }
  .photothumb{ position:relative; width:64px; height:64px; border-radius:9px; overflow:hidden; border:1px solid var(--line); }
  .photothumb img{ width:100%; height:100%; object-fit:cover; display:block; }
  .photothumb .rm{ position:absolute; top:2px; right:2px; width:18px; height:18px; border-radius:50%; background:rgba(0,0,0,.55); color:#fff; display:flex; align-items:center; justify-content:center; border:none; }
  .photothumb .rm svg{ width:10px; height:10px; }
  .addphoto{ width:64px; height:64px; border-radius:9px; border:1px dashed var(--line); display:flex; align-items:center; justify-content:center; color:var(--ink-faint); background:var(--surface-2); position:relative; overflow:hidden; }
  .addphoto svg{ width:20px; height:20px; }
  .addphoto input{ position:absolute; inset:0; opacity:0; }

  /* Buttons */
  .btn{ display:inline-flex; align-items:center; justify-content:center; gap:7px; padding:11px 16px; border-radius:11px; border:none; font-weight:600; font-size:14px; cursor:pointer; }
  .btn svg{ width:15px; height:15px; }
  .btn-accent{ background:var(--accent); color:var(--accent-ink); }
  .btn-outline{ background:var(--surface); color:var(--ink); border:1px solid var(--line); }
  .btn-ghost{ background:transparent; color:var(--accent-2); }
  .btn-block{ width:100%; }
  .btn-sm{ padding:8px 12px; font-size:13px; border-radius:9px; }
  .btn-danger{ background:var(--bad-soft); color:var(--bad); }
  .btn:disabled{ opacity:.5; }

  /* Filter chips */
  .chiprow{ display:flex; gap:7px; overflow-x:auto; padding-bottom:2px; margin-bottom:12px; }
  .chip{ flex-shrink:0; padding:7px 13px; border-radius:99px; border:1px solid var(--line); background:var(--surface); font-size:13px; font-weight:600; color:var(--ink-dim); white-space:nowrap; }
  .chip.active{ background:var(--ink); color:var(--bg); border-color:var(--ink); }

  /* Historial rows */
  .hist-day{ padding:13px 14px; border-bottom:1px solid var(--line); }
  .hist-day:last-child{ border-bottom:none; }
  .hist-day .hd-top{ display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
  .hist-day .hd-date{ font-weight:600; font-size:13.5px; text-transform:capitalize; }
  .hist-day .hd-total{ font-weight:700; font-size:14.5px; color:var(--accent); }
  .hist-day .hd-breakdown{ display:flex; flex-wrap:wrap; gap:6px; }
  .hd-pill{ font-size:12px; background:var(--surface-2); color:var(--ink-dim); padding:3px 9px; border-radius:99px; }
  .hd-pill b{ color:var(--ink); font-weight:700; }

  /* Compras */
  .compra-row{ padding:13px 14px; border-bottom:1px solid var(--line); display:flex; gap:11px; align-items:center; }
  .compra-row:last-child{ border-bottom:none; }
  .compra-row .cphoto{ width:44px; height:44px; border-radius:9px; object-fit:cover; flex-shrink:0; background:var(--surface-2); }
  .compra-row .cinfo{ flex:1; min-width:0; }
  .compra-row .cinfo .desc{ font-weight:600; font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .compra-row .cinfo .meta{ font-size:12px; color:var(--ink-faint); }
  .compra-row .cmonto{ font-weight:700; font-size:14px; text-align:right; flex-shrink:0; }
  .compra-row .rowacts{ display:flex; gap:4px; flex-shrink:0; }
  .compra-row .cedit,.compra-row .cdel{ flex-shrink:0; width:30px; height:30px; border-radius:8px; border:none; background:transparent; color:var(--ink-faint); display:flex; align-items:center; justify-content:center; }
  .compra-row .cedit svg,.compra-row .cdel svg{ width:15px; height:15px; }
  .compra-row .cdel.confirm{ background:var(--bad-soft); color:var(--bad); }

  .pedido-row{ padding:13px 14px; border-bottom:1px solid var(--line); display:flex; gap:11px; align-items:flex-start; }
  .pedido-row:last-child{ border-bottom:none; }
  .pedido-row .prinfo{ flex:1; min-width:0; }
  .pedido-row .ptop{ display:flex; justify-content:space-between; align-items:baseline; gap:8px; margin-bottom:6px; }
  .pedido-row .pdate{ font-weight:600; font-size:14px; }
  .pedido-row .pprov{ font-size:12px; color:var(--ink-faint); }
  .pedido-row .pmats{ display:flex; flex-wrap:wrap; gap:6px; }
  .pedido-row .rowacts{ display:flex; gap:4px; flex-shrink:0; }
  .pedido-row .cedit,.pedido-row .cdel{ flex-shrink:0; width:30px; height:30px; border-radius:8px; border:none; background:transparent; color:var(--ink-faint); display:flex; align-items:center; justify-content:center; }
  .pedido-row .cedit svg,.pedido-row .cdel svg{ width:15px; height:15px; }
  .pedido-row .cdel.confirm{ background:var(--bad-soft); color:var(--bad); }

  /* Forms */
  .form-row{ margin-bottom:12px; }
  .form-row label{ display:block; font-size:12.5px; font-weight:600; color:var(--ink-dim); margin-bottom:5px; }
  .form-row input[type=text], .form-row input[type=number], .form-row input[type=date], .form-row select, .form-row textarea{
    width:100%; padding:10px 11px; border:1px solid var(--line); border-radius:10px; font-size:14.5px; background:var(--surface); color:var(--ink); font-family:inherit;
  }
  .form-row .hint{ font-size:11.5px; color:var(--ink-faint); margin-top:4px; }
  .checklist{ display:flex; flex-wrap:wrap; gap:7px; }
  .checkchip{ display:flex; align-items:center; gap:6px; padding:8px 12px; border-radius:99px; border:1px solid var(--line); background:var(--surface); font-size:13px; font-weight:600; }
  .checkchip input{ width:15px; height:15px; }

  /* Obra / contratista admin cards */
  .admin-row{ display:flex; align-items:center; gap:11px; padding:13px 14px; border-bottom:1px solid var(--line); }
  .admin-row:last-child{ border-bottom:none; }
  .admin-row .ai{ flex:1; min-width:0; }
  .admin-row .ai .n{ font-weight:600; font-size:14.5px; }
  .admin-row .ai .m{ font-size:12px; color:var(--ink-faint); margin-top:2px; }
  .admin-row .pills{ display:flex; flex-wrap:wrap; gap:5px; margin-top:5px; }
  .pill-sm{ font-size:11px; background:var(--accent-2-soft); color:var(--accent-2); padding:2px 8px; border-radius:99px; font-weight:600; }
  .status-tag{ font-size:11px; font-weight:700; padding:3px 9px; border-radius:99px; flex-shrink:0; }
  .status-tag.on{ background:var(--good-soft); color:var(--good); }
  .status-tag.off{ background:var(--surface-2); color:var(--ink-faint); }
  .status-tag.bad{ background:var(--bad-soft); color:var(--bad); }
  .admin-row .iconbtn{ width:32px; height:32px; border-radius:9px; border:none; background:var(--surface-2); color:var(--ink-dim); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .admin-row .iconbtn svg{ width:15px; height:15px; }

  /* Charts */
  .chartcard{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:16px 14px 10px; box-shadow:var(--shadow); margin-bottom:14px; }
  .chartcard h3{ font-size:13px; font-weight:600; color:var(--ink-dim); text-transform:uppercase; letter-spacing:.04em; margin-bottom:12px; }
  .barchart{ display:flex; align-items:flex-end; gap:4px; height:120px; }
  .barchart .bar-col{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; min-width:0; }
  .barchart .bar{ width:100%; max-width:22px; background:var(--accent-2); border-radius:4px 4px 0 0; min-height:2px; }
  .barchart .bar.bar-off{ background:var(--bad); opacity:.5; }
  .barchart .bar-col .bv{ font-size:9.5px; color:var(--ink-faint); margin-bottom:3px; }
  .barchart .bar-col .bl{ font-size:9px; color:var(--ink-faint); margin-top:5px; white-space:nowrap; }
  .hbars .hbar-row{ display:flex; align-items:center; gap:9px; margin-bottom:9px; }
  .hbars .hbar-row .hl{ width:84px; flex-shrink:0; font-size:12.5px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .hbars .hbar-row .htrack{ flex:1; height:11px; background:var(--surface-2); border-radius:6px; overflow:hidden; }
  .hbars .hbar-row .hfill{ height:100%; background:var(--accent); border-radius:6px; }
  .hbars .hbar-row .hv{ width:28px; flex-shrink:0; text-align:right; font-size:12.5px; font-weight:700; }

  /* Bottom nav */
  nav.tabbar{
    position:sticky; bottom:0; z-index:30;
    background:var(--surface); border-top:1px solid var(--line);
    display:flex; padding:6px 6px calc(6px + env(safe-area-inset-bottom));
    max-width:560px; margin:0 auto;
    flex-shrink:0;
  }
  nav.tabbar .navbtn{ flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:7px 2px; border:none; background:transparent; color:var(--ink-faint); }
  nav.tabbar .navbtn svg{ width:21px; height:21px; }
  nav.tabbar .navbtn span{ font-size:10px; font-weight:600; }
  nav.tabbar .navbtn.active{ color:var(--accent); }

  /* Modal */
  .modal-backdrop{ position:fixed; inset:0; background:rgba(15,17,20,.5); z-index:50; display:flex; align-items:flex-end; justify-content:center; opacity:0; pointer-events:none; transition:opacity .15s; }
  .modal-backdrop.open{ opacity:1; pointer-events:auto; }
  .modal{ background:var(--surface); width:100%; max-width:560px; border-radius:18px 18px 0 0; padding:18px 16px calc(18px + env(safe-area-inset-bottom)); max-height:86vh; overflow-y:auto; transform:translateY(12px); transition:transform .15s; }
  .modal-backdrop.open .modal{ transform:translateY(0); }
  .modal-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
  .modal-head h2{ font-size:17px; font-weight:600; }
  .modal-head button{ width:30px; height:30px; border-radius:9px; border:none; background:var(--surface-2); color:var(--ink-dim); display:flex; align-items:center; justify-content:center; }
  .modal-head button svg{ width:14px; height:14px; }

  /* Login */
  .login-gate{ position:fixed; inset:0; z-index:200; background:var(--bg); display:flex; align-items:center; justify-content:center; padding:24px; }
  .login-card{ width:100%; max-width:340px; background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:26px 22px; box-shadow:var(--shadow); text-align:center; }
  .login-card .login-logo{ max-width:190px; width:100%; height:auto; margin:0 auto 18px; display:block; }
  .login-card h2{ font-size:16px; margin-bottom:4px; }
  .login-card .login-sub{ font-size:12.5px; color:var(--ink-faint); margin-bottom:18px; }
  .login-card .form-row{ text-align:left; }
  .login-card .btn{ margin-top:6px; }
  .login-error{ font-size:12.5px; font-weight:600; color:var(--bad); margin:-4px 0 12px; min-height:1px; }
  .login-remember{ display:flex; align-items:center; gap:7px; font-size:12.5px; color:var(--ink-dim); margin:2px 0 16px; justify-content:flex-start; }
  .login-remember input{ width:15px; height:15px; }

  /* Toast */
  #toastwrap{ position:fixed; top:10px; left:0; right:0; z-index:99; display:flex; justify-content:center; pointer-events:none; }
  .toast{ background:var(--ink); color:var(--bg); padding:9px 16px; border-radius:99px; font-size:12.5px; font-weight:600; box-shadow:var(--shadow); opacity:0; transform:translateY(-8px); transition:all .2s; }
  .toast.show{ opacity:1; transform:none; }
  .toast.bad{ background:var(--bad); color:#fff; }

  .banner{ display:flex; gap:9px; align-items:flex-start; background:var(--warn-soft); color:var(--warn); border-radius:var(--radius-sm); padding:10px 12px; font-size:12.5px; margin-bottom:14px; line-height:1.45; }
  .banner svg{ width:16px; height:16px; flex-shrink:0; margin-top:1px; }
  .banner.bad{ background:var(--bad-soft); color:var(--bad); }

  .brow-label{ font-size:12.5px; font-weight:600; color:var(--ink-dim); margin-bottom:6px; }
  .segtoggle{ display:flex; background:var(--surface-2); border-radius:11px; padding:3px; gap:3px; }
  .segtoggle button{ flex:1; padding:9px 6px; border:none; border-radius:8px; background:transparent; font-weight:600; font-size:13px; color:var(--ink-dim); }
  .segtoggle button.active{ background:var(--surface); color:var(--ink); box-shadow:var(--shadow); }
  .segtoggle button.active.bad{ background:var(--bad-soft); color:var(--bad); box-shadow:none; }
  .bfield{ margin-bottom:14px; }
  .bfield .sublabel{ display:block; font-size:12px; font-weight:600; color:var(--ink-faint); margin-bottom:5px; }
  .bfield-single input[type=text]{ width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:9px; font-size:13.5px; background:var(--surface); color:var(--ink); font-family:inherit; }
  .matlist{ display:flex; flex-direction:column; gap:10px; margin-top:9px; }
  .matrow{ display:flex; gap:7px; align-items:flex-end; }
  .matlist .matrow input{ padding:9px 10px; border:1px solid var(--line); border-radius:9px; font-size:13.5px; background:var(--surface); color:var(--ink); font-family:inherit; width:100%; box-sizing:border-box; }

function pad2(n){ return String(n).padStart(2,'0'); }
function todayISO(d){ d = d || new Date(); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function addDaysISO(iso, delta){
  var p = iso.split('-').map(Number);
  var d = new Date(p[0], p[1]-1, p[2]);
  d.setDate(d.getDate()+delta);
  return todayISO(d);
}
function isoToDate(iso){ var p = iso.split('-').map(Number); return new Date(p[0], p[1]-1, p[2]); }
function fmtDateLong(iso){
  try{
    return isoToDate(iso).toLocaleDateString('es-PY', {weekday:'long', day:'numeric', month:'long', year:'numeric'});
  }catch(e){ return iso; }
}
function fmtDateShort(iso){
  try{
    return isoToDate(iso).toLocaleDateString('es-PY', {day:'2-digit', month:'2-digit'});
  }catch(e){ return iso; }
}
function fmtDateMed(iso){
  try{
    return isoToDate(iso).toLocaleDateString('es-PY', {weekday:'short', day:'numeric', month:'short'});
  }catch(e){ return iso; }
}
function fmtGs(n){
  n = Math.round(Number(n)||0);
  try{ return new Intl.NumberFormat('es-PY').format(n) + ' Gs.'; }
  catch(e){ return n + ' Gs.'; }
}
function nowISO(){ return new Date().toISOString(); }
function clamp(n, min, max){ return Math.max(min, Math.min(max, n)); }
function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function debounce(fn, ms){
  var t;
  return function(){
    var args = arguments, ctx = this;
    clearTimeout(t);
    t = setTimeout(function(){ fn.apply(ctx, args); }, ms);
  };
}
function newLocalId(){ return 'l' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function docIdFor(obraId, fecha){ return obraId + '__' + fecha; }

function preserveFocus(container, renderFn){
  var active = document.activeElement;
  var info = null;
  if (active && container.contains(active) && active.id){
    info = { id: active.id, selStart: null, selEnd: null, value: active.value };

/* ============================================================
   ALMACENAMIENTO LOCAL DE RESPALDO (cuando la nube no está disponible)
   ============================================================ */
function makeLocalStore(){
  var mem = {};
  try{ mem = JSON.parse(localStorage.getItem('parteobra:localdb') || '{}'); }catch(e){ mem = {}; }
  function persist(){
    try{ localStorage.setItem('parteobra:localdb', JSON.stringify(mem)); }catch(e){}
  }
  function coll(path){ if(!mem[path]) mem[path] = {}; return mem[path]; }
  var listeners = {};
  function notify(path){ (listeners[path]||[]).slice().forEach(function(fn){ fn(); }); }

  function docApi(path, id){
    return {
      id: id,
      get: function(){
        var c = coll(path); var data = c[id];
        return Promise.resolve({ id: id, exists: !!data, data: function(){ return data ? JSON.parse(JSON.stringify(data)) : undefined; } });
      },
      set: function(data){
        var c = coll(path); c[id] = JSON.parse(JSON.stringify(data)); persist(); notify(path);
        return Promise.resolve();
      },
      delete: function(){
        var c = coll(path); delete c[id]; persist(); notify(path);
        return Promise.resolve();
      },
      onSnapshot: function(next){
        var cb = function(){
          var c = coll(path); var data = c[id];
          next({ id: id, exists: !!data, data: function(){ return data ? JSON.parse(JSON.stringify(data)) : undefined; } });
        };
        listeners[path] = listeners[path] || [];
        listeners[path].push(cb);
        cb();
        return function(){ listeners[path] = (listeners[path]||[]).filter(function(f){ return f!==cb; }); };
      }
    };
  }
  function collApi(path){
    return {
      doc: function(id){ return docApi(path, id || newLocalId()); },
      add: function(data){ var ref = docApi(path, newLocalId()); return ref.set(data).then(function(){ return ref; }); },
      get: function(){
        var c = coll(path);
        return Promise.resolve({ docs: Object.keys(c).map(function(id){
          var data = c[id];
          return { id:id, exists:true, data:function(){ return JSON.parse(JSON.stringify(data)); } };
        })});
      },
      onSnapshot: function(next){
        var cb = function(){
          var c = coll(path);
          next({ docs: Object.keys(c).map(function(id){
            var data = c[id];
            return { id:id, exists:true, data:function(){ return JSON.parse(JSON.stringify(data)); } };
          })});
        };
        listeners[path] = listeners[path] || [];
        listeners[path].push(cb);
        cb();
        return function(){ listeners[path] = (listeners[path]||[]).filter(function(f){ return f!==cb; }); };
      }
    };
  }
  return { collection: collApi };
}

/* ============================================================
   CAPA DE DATOS (usa la nube si está disponible, si no cae al modo local)
   ============================================================ */
var Store = {
  backend: null,
  dbRef: null,
  local: null,

  init: function(db){
    if (db){ this.backend = 'db'; this.dbRef = db; }
    else { this.backend = 'local'; this.local = makeLocalStore(); }
  },

  _applyFilters: function(rows, opts){
    opts = opts || {};
    var out = rows;
    (opts.where || []).forEach(function(w){
      var field = w[0], op = w[1], val = w[2];
      out = out.filter(function(r){
        var v = r[field];
        switch(op){
          case '==': return v === val;
          case '!=': return v !== val;
          case '<': return v < val;
          case '<=': return v <= val;
          case '>': return v > val;
          case '>=': return v >= val;
          case 'array-contains': return Array.isArray(v) && v.indexOf(val) !== -1;
          default: return true;
        }
      });
    });
    if (opts.orderBy){
      var field2 = opts.orderBy[0], dir = opts.orderBy[1] || 'asc';
      out = out.slice().sort(function(a,b){
        var av = a[field2], bv = b[field2];
        if (av === bv) return 0;
        if (av === undefined) return 1;
        if (bv === undefined) return -1;
        return (av < bv ? -1 : 1) * (dir === 'desc' ? -1 : 1);
      });
    }
    if (opts.limit) out = out.slice(0, opts.limit);
    return out;
  },

  subscribeCollection: function(path, opts, cb){
    opts = opts || {};
    if (this.backend === 'db'){
      // Only equality/where filters go to Firestore server-side (need no composite
      // index). orderBy + limit are applied client-side so this never requires
      // creating a composite index in the Firebase console.
      var q = this.dbRef.collection(path);
      (opts.where || []).forEach(function(w){ q = q.where(w[0], w[1], w[2]); });
      var self = this;
      return q.onSnapshot(function(snap){
        var rows = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
        cb(self._applyFilters(rows, { orderBy: opts.orderBy, limit: opts.limit }));
      }, function(err){ console.error('db error', path, err); toast('Problema de sincronización', 'bad'); });
    } else {
      var self2 = this;
      return this.local.collection(path).onSnapshot(function(snap){
        var rows = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
        cb(self2._applyFilters(rows, opts));
      });
    }
  },

  getCollection: function(path, opts){
    opts = opts || {};
    var self = this;
    if (this.backend === 'db'){
      var q = this.dbRef.collection(path);
      (opts.where || []).forEach(function(w){ q = q.where(w[0], w[1], w[2]); });
      return q.get().then(function(snap){
        var rows = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
        return self._applyFilters(rows, { orderBy: opts.orderBy, limit: opts.limit });
      });
    } else {
      return this.local.collection(path).get().then(function(snap){
        var rows = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
        return self._applyFilters(rows, opts);
      });
    }
  },

  getDoc: function(path, id){
    var ref = this.backend === 'db' ? this.dbRef.doc(path + '/' + id) : this.local.collection(path).doc(id);
    return ref.get().then(function(s){ return s.exists ? Object.assign({id:s.id}, s.data()) : null; });
  },

  subscribeDoc: function(path, id, cb){
    var ref = this.backend === 'db' ? this.dbRef.doc(path + '/' + id) : this.local.collection(path).doc(id);
    return ref.onSnapshot(function(s){ cb(s.exists ? Object.assign({id:s.id}, s.data()) : null); }, function(err){ console.error('db error', path, err); });
  },

  setDoc: function(path, id, data){
    var ref = this.backend === 'db' ? this.dbRef.doc(path + '/' + id) : this.local.collection(path).doc(id);
    return ref.set(data);
  },

  addDoc: function(path, data){
    var c = this.backend === 'db' ? this.dbRef.collection(path) : this.local.collection(path);
    return c.add(data).then(function(ref){ return ref.id; });
  },

  deleteDoc: function(path, id){
    var ref = this.backend === 'db' ? this.dbRef.doc(path + '/' + id) : this.local.collection(path).doc(id);
    return ref.delete();
  }
};

async function seedInitialDataIfEmpty(){
  // Checks each collection independently (not just 'obras') so that if an
  // earlier partial seed left some collections empty, they get backfilled
  // on the next load instead of being skipped forever. A collection that
  // already has data (real or previously seeded) is left untouched.
  var already = null;
  try{ already = localStorage.getItem('parteobra:seedDone2'); }catch(e){}
  if (already === '1') return;
  var allNonEmpty = true;
  for (var collection in SEED_DATA){
    var docs = SEED_DATA[collection];
    var existing = [];
    try{ existing = await Store.getCollection(collection, {}); }
    catch(e){ console.error('seed check failed', collection, e); }
    if (existing && existing.length > 0) continue;
    allNonEmpty = false;
    for (var i = 0; i < docs.length; i++){
      try{ await Store.setDoc(collection, docs[i].id, docs[i].data); }
      catch(e){ console.error('seed failed', collection, docs[i].id, e); allNonEmpty = false; }
    }
  }
  if (allNonEmpty){
    try{ localStorage.setItem('parteobra:seedDone2', '1'); }catch(e){}
  }
}

  try{

      db = firebase.firestore();
    }
  }catch(e){

    try{ await seedInitialDataIfEmpty(); }catch(e){ console.error('seed error', e); }
  }

  Store.subscribeCollection('obras', { orderBy: ['orden','asc'] }, function(rows){
    state.obras = rows;
    if (!state.currentObraId || !rows.find(function(o){ return o.id === state.currentObraId; })){

  Store.subscribeCollection('contratistas', {}, function(rows){
    state.contratistas = rows;
    renderCurrentTab();

  Store.subscribeCollection('usuarios', {}, function(rows){
    state.usuarios = rows;
    if (state.sesionActual){
      var yo = rows.find(function(u){ return u.id === state.sesionActual.id; });

      else { state.sesionActual = null; try{ localStorage.removeItem('parteobra:sesionUsuarioId'); }catch(e){} mostrarLogin(); }
    }
    if (state.currentTab === 'obras') renderCurrentTab();
  });

  bindGlobalUI();

}

    var p = document.getElementById('loginPassword').value;
    var errEl = document.getElementById('loginError');
    if (!u || !p){ errEl.textContent = 'Completá usuario y contraseña.'; return; }
    var found = state.usuarios.find(function(x){ return (x.usuario||'').trim().toLowerCase() === u && x.password === p && x.activo!==false; });
    if (!found){ errEl.textContent = 'Usuario o contraseña incorrectos.'; return; }
    state.sesionActual = found;
    var recordar = document.getElementById('loginRemember').checked;
    try{
      if (recordar) localStorage.setItem('parteobra:sesionUsuarioId', found.id);
      else localStorage.removeItem('parteobra:sesionUsuarioId');
    }catch(e){}
    ocultarLogin();
    renderCurrentTab();
  }
  document.getElementById('loginSubmit').onclick = intentar;
  document.getElementById('loginPassword').addEventListener('keydown', function(e){ if (e.key === 'Enter') intentar(); });
  document.getElementById('loginUsuario').addEventListener('keydown', function(e){ if (e.key === 'Enter'){ e.preventDefault(); document.getElementById('loginPassword').focus(); } });
  setTimeout(function(){ var el = document.getElementById('loginUsuario'); if (el) el.focus(); }, 50);
}

function ocultarLogin(){
  var gate = document.getElementById('loginGate');
  gate.style.display = 'none';
  gate.innerHTML = '';
}

function cerrarSesion(){
  state.sesionActual = null;
  try{ localStorage.removeItem('parteobra:sesionUsuarioId'); }catch(e){}
  mostrarLogin();
}

function setObra(id){
  state.currentObraId = id;
  try{ localStorage.setItem('parteobra:obraId', id); }catch(e){}
  state.pendingConteos = {};
  state.asistenciaDoc = null;
  state.bitacoraDoc = null;
  state.bitacoraFotosDraft = null;
  state.historial = [];
  state.historialBitacora = [];
  state.compras = [];
  state.pedidos = [];
  state.resumenSerie = [];
  state.resumenBitacora = [];
  state.comprasResumen = [];
  resubscribeForTab();
  renderCurrentTab();
}

function renderObraSelect(){
  var sel = document.getElementById('obraSelect');
  var activos = state.obras.filter(function(o){ return o.activa !== false; });
  if (!activos.length){
    sel.innerHTML = '<option>Sin obras creadas</option>';
    sel.disabled = true;
    return;
  }
  sel.disabled = false;
  sel.innerHTML = activos.map(function(o){
    return '<option value="' + o.id + '"' + (o.id === state.currentObraId ? ' selected' : '') + '>' + escapeHtml(o.nombre) + '</option>';
  }).join('');
}

/* ============================================================
   SUSCRIPCIONES POR PESTAÑA
   ============================================================ */
function unsubTab(key){
  if (state.subsTab[key]){ state.subsTab[key](); delete state.subsTab[key]; }
}
function unsubAllTab(){
  Object.keys(state.subsTab).forEach(unsubTab);
}

function resubscribeForTab(){
  unsubAllTab();
  var obraId = state.currentObraId;
  if (!obraId) { state.asistenciaDoc = null; state.bitacoraDoc = null; return; }

  if (state.currentTab === 'hoy'){
    state.subsTab.asis = Store.subscribeDoc('asistencias', docIdFor(obraId, state.currentDate), function(doc){
      state.asistenciaDoc = doc;
      preserveFocus(document.getElementById('tab-hoy'), renderTabHoy);
    });
    state.subsTab.bita = Store.subscribeDoc('bitacora', docIdFor(obraId, state.currentDate), function(doc){
      state.bitacoraDoc = doc;
      state.bitacoraFotosDraft = null;
      preserveFocus(document.getElementById('tab-hoy'), renderTabHoy);
    });
  } else if (state.currentTab === 'historial'){
    state.subsTab.hist = Store.subscribeCollection('asistencias', {
      where: [['obraId','==',obraId]], orderBy: ['fecha','desc'], limit: state.historialRango
    }, function(rows){
      state.historial = rows;
      renderTabHistorial();
    });
    state.subsTab.histBita = Store.subscribeCollection('bitacora', {
      where: [['obraId','==',obraId]], orderBy: ['fecha','desc'], limit: state.historialRango
    }, function(rows){
      state.historialBitacora = rows;
      renderTabHistorial();
    });
  } else if (state.currentTab === 'compras'){
    state.subsTab.compras = Store.subscribeCollection('compras', {
      where: [['obraId','==',obraId]], orderBy: ['fecha','desc'], limit: 300
    }, function(rows){
      state.compras = rows;
      renderTabCompras();
    });
  } else if (state.currentTab === 'pedidos'){
    state.subsTab.pedidos = Store.subscribeCollection('pedidos', {
      where: [['obraId','==',obraId]], orderBy: ['fecha','desc'], limit: 300
    }, function(rows){
      state.pedidos = rows;
      renderTabPedidos();
    });
  } else if (state.currentTab === 'resumen'){
    state.subsTab.resumen = Store.subscribeCollection('asistencias', {
      where: [['obraId','==',obraId]], orderBy: ['fecha','desc'], limit: 90
    }, function(rows){
      state.resumenSerie = rows;
      renderTabResumen();
    });
    state.subsTab.resumenBita = Store.subscribeCollection('bitacora', {
      where: [['obraId','==',obraId]], orderBy: ['fecha','desc'], limit: 90
    }, function(rows){
      state.resumenBitacora = rows;
      renderTabResumen();
    });
    state.subsTab.resumenCompras = Store.subscribeCollection('compras', {
      where: [['obraId','==',obraId]], orderBy: ['fecha','desc'], limit: 300
    }, function(rows){
      state.comprasResumen = rows;
      renderTabResumen();
    });
  }
}

/* ============================================================
   NAVEGACIÓN
   ============================================================ */
function switchTab(tab){
  state.currentTab = tab;
  document.querySelectorAll('.navbtn').forEach(function(b){ b.classList.toggle('active', b.dataset.tab === tab); });
  document.querySelectorAll('.tabpanel').forEach(function(p){ p.classList.remove('active'); });
  document.getElementById('tab-' + tab).classList.add('active');
  resubscribeForTab();
  renderCurrentTab();
}

function renderCurrentTab(){
  renderObraSelect();
  if (state.currentTab === 'hoy') renderTabHoy();
  else if (state.currentTab === 'historial') renderTabHistorial();
  else if (state.currentTab === 'compras') renderTabCompras();
  else if (state.currentTab === 'pedidos') renderTabPedidos();
  else if (state.currentTab === 'resumen') renderTabResumen();
  else if (state.currentTab === 'obras') renderTabObras();
}

/* Combina los registros de asistencia y bitácora de una obra en una
   sola lista por fecha (algunos días pueden tener bitácora sin
   asistencia — por ejemplo, un día no trabajado — o viceversa).
   Devuelve las fechas en orden ascendente; pasar `limit` para
   quedarse con las N más recientes. */
function mergedDias(asisRows, bitaRows, limit){
  var map = {};
  (asisRows||[]).forEach(function(d){ map[d.fecha] = map[d.fecha] || {}; map[d.fecha].fecha = d.fecha; map[d.fecha].asis = d; });
  (bitaRows||[]).forEach(function(b){ map[b.fecha] = map[b.fecha] || {}; map[b.fecha].fecha = b.fecha; map[b.fecha].bita = b; });
  var fechas = Object.keys(map).sort();
  if (limit) fechas = fechas.slice(-limit);
  return fechas.map(function(f){ return map[f]; });
}
function diaTotalObreros(d){
  return d.asis ? Object.keys(d.asis.conteos||{}).reduce(function(s,k){ return s + (d.asis.conteos[k]||0); }, 0) : 0;
}
function diaNoTrabajado(d){
  return !!(d.bita && d.bita.trabajado === false);
}

function conteoValorPara(cid){
  if (Object.prototype.hasOwnProperty.call(state.pendingConteos, cid)) return state.pendingConteos[cid];
  var c = state.asistenciaDoc && state.asistenciaDoc.conteos;
  return (c && c[cid]) || 0;
}
function totalHoy(){
  var lista = contratistasDeObra(state.currentObraId);
  return lista.reduce(function(sum, c){ return sum + conteoValorPara(c.id); }, 0);
}

      html += '<button class="stp-plus" data-cid="' + c.id + '">+</button>';
      html += '</div></div>';

      }
    });

      if (e.target.classList.contains('stp-input')){

  if (chipsClima) chipsClima.addEventListener('click', function(e){

    if (!btn) return;

  var fotoInput = document.getElementById('bitacoraFotoInput');

        var nuevas = actuales.concat([dataUrl]);
        state.bitacoraFotosDraft = nuevas;

function changeDay(iso){
  state.currentDate = iso;
  state.pendingConteos = {};
  state.asistenciaDoc = null;
  state.bitacoraDoc = null;
  state.bitacoraFotosDraft = null;
  resubscribeForTab();
  renderTabHoy();
}

function setConteoLocal(cid, val, skipDomSync){
  state.pendingConteos[cid] = val;
  if (!skipDomSync){
    var inp = document.getElementById('stp-' + cid);
    if (inp) inp.value = val;
  }
  var row = document.querySelector('.crow[data-cid="' + cid + '"] .m');
  if (row) row.textContent = val > 0 ? (val + ' ' + (val===1?'obrero':'obreros')) : 'Sin registrar';

  if (!perContratistaDebounce[cid]){
    perContratistaDebounce[cid] = debounce(function(){
      var pendCid = cid;
      var v = state.pendingConteos[pendCid];
      var conteos = Object.assign({}, (state.asistenciaDoc && state.asistenciaDoc.conteos) || {}, state.pendingConteos);
      if (!v) delete conteos[pendCid]; else conteos[pendCid] = v;
      guardarAsistencia(conteos);
      delete state.pendingConteos[pendCid];
    }, 500);
  }
  perContratistaDebounce[cid]();
}

async function guardarAsistencia(conteos){
  if (!state.currentObraId) return;
  beginSave();
  try{
    await Store.setDoc('asistencias', docIdFor(state.currentObraId, state.currentDate), {
      obraId: state.currentObraId, fecha: state.currentDate, conteos: conteos, actualizadoEn: nowISO()
    });
  }catch(e){ console.error(e); toast('No se pudo guardar la asistencia', 'bad'); }
  endSave();
}

async function guardarBitacora(partial){
  if (!state.currentObraId) return;
  var base = {
    obraId: state.currentObraId,
    fecha: state.currentDate,
    trabajado: (state.bitacoraDoc && typeof state.bitacoraDoc.trabajado === 'boolean') ? state.bitacoraDoc.trabajado : true,
    motivoNoTrabajo: (state.bitacoraDoc && state.bitacoraDoc.motivoNoTrabajo) || '',
    climaEstado: (state.bitacoraDoc && state.bitacoraDoc.climaEstado) || '',
    nota: (state.bitacoraDoc && state.bitacoraDoc.nota) || '',
    fotos: (state.bitacoraDoc && state.bitacoraDoc.fotos) || []
  };
  var data = Object.assign(base, partial, { actualizadoEn: nowISO() });
  if (JSON.stringify(data).length > 240000){
    toast('Las fotos pesan demasiado juntas. Sacá una y probá de nuevo.', 'bad');
    if (partial.fotos){ state.bitacoraFotosDraft = base.fotos; renderTabHoy(); }
    return;
  }
  beginSave();
  try{
    await Store.setDoc('bitacora', docIdFor(state.currentObraId, state.currentDate), data);

/* ============================================================
   COMPRESIÓN DE FOTOS
   ============================================================ */
/* db documents are capped at 256 KiB total, so a compressed photo must
   stay well under that on its own — targetBytes is the hard budget for
   the resulting data URL string (roughly 1 byte per character). */
function compressImage(file, maxDim, quality, targetBytes){
  maxDim = maxDim || 700; quality = quality || 0.6; targetBytes = targetBytes || 70000;
  return new Promise(function(resolve, reject){
    var reader = new FileReader();
    reader.onerror = reject;
    reader.onload = function(){
      var img = new Image();
      img.onerror = reject;
      img.onload = function(){
        var w = img.width, h = img.height;
        var dim = maxDim;
        var out = '';
        var attempts = 0;
        while (attempts < 9){
          var scale = Math.min(1, dim / Math.max(w, h));
          var cw = Math.max(1, Math.round(w * scale)), ch = Math.max(1, Math.round(h * scale));
          var canvas = document.createElement('canvas');
          canvas.width = cw; canvas.height = ch;
          var ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, cw, ch);
          var q = quality;
          out = canvas.toDataURL('image/jpeg', q);
          var qtries = 0;
          while (out.length > targetBytes && qtries < 4){
            q *= 0.65; qtries++;
            out = canvas.toDataURL('image/jpeg', q);
          }
          if (out.length <= targetBytes) break;
          dim = Math.round(dim * 0.75);
          attempts++;
        }
        resolve(out);
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function slug(s){ return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'') || 'obra'; }

async function offerDownload(filename, data){
  try{
    var mime = /\.pdf$/i.test(filename) ? 'application/pdf' : 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
    var blob = (typeof Blob !== 'undefined' && data instanceof Blob) ? data : new Blob([data], { type: mime });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
    toast('Archivo listo');
  }catch(e){
    console.error(e);
    toast('No se pudo generar el archivo', 'bad');
  }
}

  var breakdown = Object.keys(porContratista).map(function(cid){ return { nombre: contratistaNombre(cid), total: porContratista[cid] }; }).sort(function(a,b){ return b.total - a.total; }).slice(0,8);
  var maxB = breakdown.reduce(function(m,b){ return Math.max(m,b.total); }, 1);

  var maxDia = dias.reduce(function(m,d){ return Math.max(m, diaTotalObreros(d)); }, 1);

    html += '<div class="empty" style="padding:18px;"><p>Aún no hay suficientes datos para graficar.</p></div>';
  } else {
    html += '<div class="barchart">';
    dias.forEach(function(d){
      var noTrabajado = diaNoTrabajado(d);
      var t = diaTotalObreros(d);
      var hpct = noTrabajado ? 6 : Math.max(2, Math.round((t/maxDia)*100));
      html += '<div class="bar-col"><div class="bv num">' + (noTrabajado ? '—' : (t||'')) + '</div><div class="bar' + (noTrabajado?' bar-off':'') + '" style="height:' + hpct + '%"></div><div class="bl">' + escapeHtml(fmtDateShort(d.fecha)) + '</div></div>';

  html += '</div>';

  html += '<div class="chartcard"><h3>Aporte por contratista (período)</h3>';
  if (!breakdown.length){
    html += '<div class="empty" style="padding:18px;"><p>Sin datos en el período mostrado.</p></div>';
  } else {
    html += '<div class="hbars">';
    breakdown.forEach(function(b){
      var pct = Math.max(3, Math.round((b.total/maxB)*100));
      html += '<div class="hbar-row"><div class="hl">' + escapeHtml(b.nombre) + '</div><div class="htrack"><div class="hfill" style="width:' + pct + '%"></div></div><div class="hv num">' + b.total + '</div></div>';
    });
    html += '</div>';
  }
  html += '</div>';

  root.innerHTML = html;
}

function openModal(html){
  document.getElementById('modalBody').innerHTML = html;
  document.getElementById('modalBackdrop').classList.add('open');
}
function closeModal(){
  document.getElementById('modalBackdrop').classList.remove('open');
}

function openModalNuevaObra(){
  openModal(
    '<div class="modal-head"><h2>Nueva obra</h2><button id="mClose">' + ICO.close + '</button></div>' +
    '<div class="form-row"><label>Nombre de la obra</label><input type="text" id="fNombre" placeholder="Ej: Edificio Ykuá — Etapa 2"></div>' +

    '<button class="btn btn-accent btn-block" id="mSave">Crear obra</button>'
  );
  document.getElementById('mClose').onclick = closeModal;
  document.getElementById('mSave').onclick = async function(){
    var nombre = document.getElementById('fNombre').value.trim();
    if (!nombre){ toast('Ingresá un nombre', 'bad'); return; }
    var ubicacion = document.getElementById('fUbicacion').value.trim();
    try{
      var id = await Store.addDoc('obras', { nombre: nombre, ubicacion: ubicacion, activa: true, orden: Date.now(), creadoEn: nowISO() });
      state.currentObraId = id;
      try{ localStorage.setItem('parteobra:obraId', id); }catch(e){}
      closeModal();
      toast('Obra creada');
    }catch(e){ console.error(e); toast('No se pudo crear la obra', 'bad'); }
  };
}

    '<button class="addrow-btn" id="btnAddMatModal" style="justify-content:flex-start; padding-left:2px;">' + ICO.plus + ' Agregar material</button></div>' +
    '<button class="btn btn-accent btn-block" id="mSave">Guardar pedido</button>'
  );
  renderMatRows();

  document.getElementById('mClose').onclick = closeModal;
  document.getElementById('btnAddMatModal').onclick = function(){
    materiales.push({ material:'', cantidad:'' });
    renderMatRows();
  };
  document.getElementById('pedidoMatWrap').addEventListener('click', function(e){
    var rm = e.target.closest('.mat-rm');
    if (!rm) return;
    var idx = parseInt(rm.dataset.idx, 10);
    materiales.splice(idx, 1);
    if (!materiales.length) materiales.push({ material:'', cantidad:'' });
    renderMatRows();
  });
  document.getElementById('pedidoMatWrap').addEventListener('input', function(e){
    var idx = parseInt(e.target.dataset.idx, 10);
    if (isNaN(idx)) return;
    if (e.target.classList.contains('mat-name')) materiales[idx].material = e.target.value;
    else if (e.target.classList.contains('mat-qty')) materiales[idx].cantidad = e.target.value;
  });
  document.getElementById('mSave').onclick = async function(){
    var proveedor = document.getElementById('fProv').value.trim();
    var fecha = document.getElementById('fFecha').value || todayISO();
    var limpios = materiales.map(function(m){ return { material: (m.material||'').trim(), cantidad: (m.cantidad||'').trim() }; }).filter(function(m){ return m.material; });
    if (!limpios.length){ toast('Agregá al menos un material', 'bad'); return; }
    try{
      await Store.addDoc('pedidos', {
        obraId: state.currentObraId,
        fecha: fecha,
        proveedor: proveedor,
        materiales: limpios,
        creadoEn: nowISO()
      });
      closeModal(); toast('Pedido registrado');
    }catch(e){ console.error(e); toast('No se pudo guardar el pedido', 'bad'); }
  };
}

function openModalEditarPedido(id){
  var pedidos = state.pedidos || [];
  var p = pedidos.find(function(x){ return x.id === id; });
  if (!p) return;
  var materiales = (p.materiales && p.materiales.length) ? p.materiales.map(function(m){ return { material: m.material||'', cantidad: m.cantidad||'' }; }) : [{ material:'', cantidad:'' }];

  function renderMatRows(){
    var wrap = document.getElementById('pedidoMatWrap');
    if (!wrap) return;
    wrap.innerHTML = materiales.map(function(item, idx){
      return '<div class="matrow" data-idx="' + idx + '">' +
        '<div class="mat-col mat-col-name"><span class="mat-lbl">Material</span>' +
          '<input class="mat-name" data-idx="' + idx + '" type="text" placeholder="Ej: Cemento" value="' + escapeHtml(item.material) + '">' +
        '</div>' +
        '<div class="mat-col mat-col-qty"><span class="mat-lbl">Cantidad</span>' +
          '<input class="mat-qty" data-idx="' + idx + '" type="text" placeholder="Ej: 50 bolsas" value="' + escapeHtml(item.cantidad) + '">' +
        '</div>' +
        '<button class="mat-rm" data-idx="' + idx + '">' + ICO.close + '</button>' +
        '</div>';
    }).join('');
  }

  openModal(
    '<div class="modal-head"><h2>Editar pedido</h2><button id="mClose">' + ICO.close + '</button></div>' +
    '<div class="form-row"><label>Fecha</label><input type="date" id="fFecha" value="' + escapeHtml(p.fecha||todayISO()) + '"></div>' +
    '<div class="form-row"><label>Proveedor</label><input type="text" id="fProv" placeholder="Ej: Ferretería Central" value="' + escapeHtml(p.proveedor||'') + '"></div>' +
    '<div class="form-row"><label>Materiales solicitados</label><div class="matlist" id="pedidoMatWrap"></div>' +
    '<button class="addrow-btn" id="btnAddMatModal" style="justify-content:flex-start; padding-left:2px;">' + ICO.plus + ' Agregar material</button></div>' +
    '<button class="btn btn-accent btn-block" id="mSave" style="margin-bottom:9px;">Guardar cambios</button>' +
    '<button class="btn btn-outline btn-block" id="mDelete">Eliminar pedido</button>'
  );
  renderMatRows();

  document.getElementById('mClose').onclick = closeModal;
  document.getElementById('btnAddMatModal').onclick = function(){
    materiales.push({ material:'', cantidad:'' });
    renderMatRows();
  };
  document.getElementById('pedidoMatWrap').addEventListener('click', function(e){
    var rm = e.target.closest('.mat-rm');
    if (!rm) return;
    var idx = parseInt(rm.dataset.idx, 10);
    materiales.splice(idx, 1);
    if (!materiales.length) materiales.push({ material:'', cantidad:'' });
    renderMatRows();
  });
  document.getElementById('pedidoMatWrap').addEventListener('input', function(e){
    var idx = parseInt(e.target.dataset.idx, 10);
    if (isNaN(idx)) return;
    if (e.target.classList.contains('mat-name')) materiales[idx].material = e.target.value;
    else if (e.target.classList.contains('mat-qty')) materiales[idx].cantidad = e.target.value;
  });
  document.getElementById('mSave').onclick = async function(){
    var proveedor = document.getElementById('fProv').value.trim();
    var fecha = document.getElementById('fFecha').value || todayISO();
    var limpios = materiales.map(function(m){ return { material: (m.material||'').trim(), cantidad: (m.cantidad||'').trim() }; }).filter(function(m){ return m.material; });
    if (!limpios.length){ toast('Agregá al menos un material', 'bad'); return; }
    try{
      await Store.setDoc('pedidos', id, Object.assign({}, p, {
        fecha: fecha,
        proveedor: proveedor,
        materiales: limpios
      }));
      closeModal(); toast('Pedido actualizado');
    }catch(e){ console.error(e); toast('No se pudo guardar el pedido', 'bad'); }
  };
  document.getElementById('mDelete').onclick = async function(){
    try{
      await Store.deleteDoc('pedidos', id);
      closeModal(); toast('Pedido eliminado');
    }catch(e){ console.error(e); toast('No se pudo eliminar', 'bad'); }
  };
}
